[package]
name = "cosmic-quake-term"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.90"
description = "Quake-style drop-down terminal for the COSMIC desktop"
readme = "README.md"
repository = "https://github.com/nkxy1/Cosmic-Terminal-QuakeStyle"
homepage = "https://github.com/nkxy1/Cosmic-Terminal-QuakeStyle"
keywords = ["terminal", "cosmic", "quake", "wayland"]
categories = ["command-line-utilities"]

[dependencies]
alacritty_terminal = "0.25.1"
log = "0.4"
open = "5.3.2"
tokio = { version = "1", features = ["sync", "time"] }
cosmic-text = { version = "0.19", features = ["monospace_fallback", "shape-run-cache"] }
hex_color = { version = "3", features = ["serde"] }
indexmap = "2"
regex = "1"
ron = "0.11"
serde = { version = "1", features = ["serde_derive"] }
shlex = "1"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
zbus = "5"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "dfc68d1"
default-features = false
features = ["wayland", "wgpu", "tokio", "winit", "multi-window", "dbus-config"]

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# --- Packages (built by .github/workflows/release.yml) -------------------------------
# The binary links only against libc, libgcc and libxkbcommon; Wayland, EGL and Vulkan
# are loaded at runtime, so they are recommendations rather than hard dependencies.

[package.metadata.deb]
maintainer = "norman <62038404+nkxy1@users.noreply.github.com>"
section = "x11"
priority = "optional"
depends = "$auto, libwayland-client0"
recommends = "libegl1, mesa-vulkan-drivers | libvulkan1"
suggests = "cosmic-session"
extended-description = """\
A drop-down terminal for the COSMIC desktop. Bind `cosmic-quake-term --toggle` to a \
shortcut to slide it in from the top of the screen and out again. Supports tabs, \
splits, several monitors, a slide animation and follows the COSMIC theme."""
assets = [
    ["target/release/cosmic-quake-term", "usr/bin/", "755"],
    ["res/dev.norman.CosmicQuakeTerm.desktop", "usr/share/applications/", "644"],
    ["res/dev.norman.CosmicQuakeTerm-autostart.desktop", "etc/xdg/autostart/", "644"],
    ["README.md", "usr/share/doc/cosmic-quake-term/README.md", "644"],
    ["LICENSE", "usr/share/doc/cosmic-quake-term/copyright", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/cosmic-quake-term", dest = "/usr/bin/cosmic-quake-term", mode = "755" },
    { source = "res/dev.norman.CosmicQuakeTerm.desktop", dest = "/usr/share/applications/dev.norman.CosmicQuakeTerm.desktop", mode = "644" },
    { source = "res/dev.norman.CosmicQuakeTerm-autostart.desktop", dest = "/etc/xdg/autostart/dev.norman.CosmicQuakeTerm-autostart.desktop", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/cosmic-quake-term/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/cosmic-quake-term/LICENSE", mode = "644", license = true },
]

[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
libwayland-client = "*"

[package.metadata.generate-rpm.recommends]
mesa-libEGL = "*"
mesa-vulkan-drivers = "*"
