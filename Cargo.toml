[package]
name = "cosmic-quake-term"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.90"

[dependencies]
alacritty_terminal = "0.25.1"
log = "0.4"
open = "5.3.2"
tokio = { version = "1", features = ["sync", "time"] }
cosmic-text = { git = "https://github.com/pop-os/cosmic-text.git", features = ["monospace_fallback", "shape-run-cache"] }
hex_color = { version = "3", features = ["serde"] }
indexmap = "2"
regex = "1"
ron = "0.11"
serde = { version = "1", features = ["serde_derive"] }
shlex = "1"
zbus = "5"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = ["wayland", "wgpu", "tokio", "winit", "multi-window", "dbus-config"]

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
