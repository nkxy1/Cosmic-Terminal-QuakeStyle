name: Release

# Pushing a tag like v0.1.0 builds the .deb and .rpm packages and publishes them as a
# GitHub release. The tag must match the version in Cargo.toml.
# Running the workflow by hand only builds the packages (as workflow artifacts).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: Debian / Ubuntu package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mold pkg-config dpkg-dev libwayland-dev libxkbcommon-dev libfontconfig-dev \
            libfreetype-dev libinput-dev libudev-dev libssl-dev libegl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install --locked cargo-deb

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: cargo deb --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb
          if-no-files-found: error

  rpm:
    name: Fedora package
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git gcc gcc-c++ make mold pkgconf-pkg-config curl rpm-build \
            wayland-devel libxkbcommon-devel mesa-libEGL-devel fontconfig-devel \
            freetype-devel libinput-devel systemd-devel openssl-devel

      - uses: actions/checkout@v4

      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }

      # Fedora's own Rust can be older than the minimum version this project needs.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-generate-rpm
        run: $HOME/.cargo/bin/cargo install --locked cargo-generate-rpm

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: cargo generate-rpm

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

  release:
    name: Publish release
    needs: [deb, rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Installation

          **Debian / Ubuntu / Pop!_OS** (amd64):

          ```sh
          sudo apt install ./cosmic-quake-term_*_amd64.deb
          ```

          **Fedora** (x86_64):

          ```sh
          sudo dnf install ./cosmic-quake-term-*.x86_64.rpm
          ```

          Then bind `cosmic-quake-term --toggle` to a key in COSMIC Settings → Keyboard →
          Custom Shortcuts. See the README for details.

          The packages are built against a COSMIC release that stores its theme config in
          version 2 (COSMIC 1.10). On older COSMIC releases the terminal falls back to the
          default colors.

          ---

          NOTES

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
